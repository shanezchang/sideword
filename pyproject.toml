[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sideword"
version = "0.4.0b1"
description = "A quiet place for words. Offline vocabulary learning in your terminal."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Shane Chang"}]
keywords = ["terminal", "vocabulary", "spaced-repetition", "language-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
sideword = "sideword.cli:main"

[project.urls]
Homepage = "https://github.com/shanezchang/sideword"
Issues = "https://github.com/shanezchang/sideword/issues"
Source = "https://github.com/shanezchang/sideword"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
bundle = ["pyinstaller==6.22.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sideword"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/packaging", "/README.md", "/README.zh-CN.md", "/CONTRIBUTING.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml", "/uv.lock", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["sideword"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true

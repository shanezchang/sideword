name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --group build --no-install-project
      - run: uv sync --locked --group build --no-build-isolation --offline
      - run: uv run --frozen --group build pytest
      - run: uv run --frozen --group build sideword --check
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group build --no-install-project
      - run: uv sync --locked --group build --no-build-isolation --offline
      - run: uv run --frozen --group build python scripts/check_build_lock.py tests.yml
      - run: uv run --frozen --group build ruff check .
      - run: uv run --frozen --group build ruff format --check .
      - run: uv build --no-sources --no-build-isolation
      - name: Verify installed wheel outside the checkout
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          cd "$(mktemp -d)"
          uv run --isolated --no-project --with "$wheel" sideword --version
          uv run --isolated --no-project --with "$wheel" sideword --check

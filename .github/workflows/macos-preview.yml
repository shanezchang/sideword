name: macOS preview
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group build --group bundle --no-install-project
      - run: uv sync --locked --group build --group bundle --no-build-isolation --offline
      - run: uv run --frozen --group build python scripts/check_build_lock.py macos-preview.yml
      - run: uv run --frozen --group build pytest
      - run: uv run --frozen --group build ruff check .
      - run: uv run --frozen --group build ruff format --check .
      - run: uv run --frozen --group build --group bundle python scripts/build_macos.py
      - name: Verify archive and install without Python on PATH
        shell: bash
        run: |
          cd dist/macos
          shasum -a 256 -c SHA256SUMS
          ditto -x -k sideword-macos-arm64.zip "$RUNNER_TEMP/unpacked"
          install_home=$(mktemp -d "$RUNNER_TEMP/sideword-home.XXXXXX")
          HOME="$install_home" PATH=/usr/bin:/bin /bin/bash "$RUNNER_TEMP/unpacked/Sideword/install.sh" --local "$RUNNER_TEMP/unpacked/Sideword" --no-modify-path
          "$install_home/.local/bin/sideword" --version
          cd "$GITHUB_WORKSPACE"
          uv run --frozen --group build python scripts/smoke_terminal.py "$install_home/.local/bin/sideword"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sideword-macos-arm64
          path: dist/macos/*
          if-no-files-found: error
